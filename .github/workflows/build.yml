# Optional: builds a ready-made ArchiveWiki.dmg on GitHub's Apple-silicon runners.
# Actions → "Build ArchiveWiki" → Run workflow → download the artifact.
name: Build ArchiveWiki
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["v*"]
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check shell syntax
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          bash -n "Build ArchiveWiki.command"
      - name: Test genealogy family connections
        run: php scripts/test-genealogy.php
      - name: Verify lockfile
        run: cargo test --locked
      - name: Check formatting
        run: rustfmt --edition 2021 --check src/archive.rs src/snapshot.rs
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  build:
    needs: validate
    runs-on: macos-latest   # Apple silicon (arm64); tracks the current supported image
    timeout-minutes: 40 # a hang fails with a log instead of lingering
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          uname -m
          rustc --version
          cargo --version
      - name: 1 - Fetch DokuWiki and PHP
        run: bash scripts/fetch-deps.sh
      - name: Test loopback router
        run: bash scripts/test-router.sh
      - name: 2 - Compile (Rust)
        run: cargo build --release --locked --verbose
      - name: 3 - Bundle app and dmg
        run: bash scripts/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ArchiveWiki-macOS-arm64
          path: dist/ArchiveWiki.dmg
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ArchiveWiki.dmg
