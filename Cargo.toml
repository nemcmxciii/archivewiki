[package]
name = "archivewiki"
version = "0.1.0"
edition = "2021"
description = "Self-contained DokuWiki desktop app (Rust + WKWebView + bundled PHP)"

[dependencies]
tao = "0.32"
wry = "0.50"
muda = "0.16"
global-hotkey = "0.6"
anyhow = "1"
dirs = "5"
libc = "0.2"
sha2 = "0.10"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
