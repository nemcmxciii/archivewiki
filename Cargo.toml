[package]
name = "archivewiki"
version = "0.1.0"
edition = "2021"
description = "Self-contained DokuWiki desktop app (Rust + WKWebView + bundled PHP)"

[dependencies]
tao = "0.32"
wry = "0.50"
muda = "0.16"
anyhow = "1"
dirs = "5"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
